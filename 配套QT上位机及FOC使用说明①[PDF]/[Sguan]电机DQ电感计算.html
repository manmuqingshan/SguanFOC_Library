<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DQ轴电感计算 · 永磁同步电机</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef0f5;
            padding: 16px;
        }

        /* 整体卡片放大 1.5 倍，再通过 transform: scale(0.8) 缩小到 80% */
        .card {
            max-width: 780px;
            width: 100%;
            background: #f9fafc;
            border-radius: 32px;
            padding: 48px 48px 56px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.02), 0 2px 8px rgba(0, 0, 0, 0.02);
            border: 1px solid #e2e6ef;
            transition: all 0.15s ease;
            transform: scale(0.8);      /* 整体缩小到 80% */
            transform-origin: center center;
            margin: 0 auto;
        }

        /* 为了让卡片在视觉上居中，body 的 flex 配合 transform 缩放 */
        .header-line {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
        }
        .header-line .bar {
            height: 2.5px;
            flex: 1;
            background: #d0d7e5;
            border-radius: 6px;
        }
        .header-line .bar:first-child {
            flex: 0 0 44px;
        }
        .header-line .bar:last-child {
            flex: 0 0 64px;
        }

        h1 {
            font-size: 32px;
            font-weight: 500;
            letter-spacing: 0.8px;
            color: #2d3748;
            background: #f9fafc;
            padding: 0 12px;
            white-space: nowrap;
        }

        .subhead {
            font-size: 20px;
            color: #6f7a8f;
            font-weight: 400;
            margin-top: -8px;
            margin-bottom: 34px;
            padding-left: 8px;
            border-left: 4px solid #d0d7e5;
            padding-left: 20px;
            line-height: 1.6;
        }
        .subhead span {
            display: inline-block;
            background: #edf1f7;
            padding: 2px 14px;
            border-radius: 18px;
            font-size: 16px;
            color: #3f4a5e;
            margin-left: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin: 36px 0 24px;
        }
        .input-row {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .input-row label {
            width: 72px;
            font-size: 22px;
            font-weight: 450;
            color: #2d3748;
            letter-spacing: 0.5px;
        }
        .input-row input {
            flex: 1;
            min-width: 140px;
            padding: 16px 22px;
            border: 1px solid #d6dce8;
            border-radius: 28px;
            font-size: 22px;
            background: #ffffff;
            color: #1a2332;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.01);
        }
        .input-row input:focus {
            border-color: #a8b5cc;
            box-shadow: 0 0 0 4px rgba(160, 175, 200, 0.12);
        }
        .input-row input::placeholder {
            color: #b0bacd;
            font-weight: 300;
            font-size: 18px;
        }
        .unit-hint {
            font-size: 18px;
            color: #7a879e;
            min-width: 44px;
            font-weight: 350;
        }

        .action-row {
            display: flex;
            gap: 20px;
            margin: 24px 0 32px;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            min-width: 140px;
            padding: 18px 14px;
            border: 1px solid #d0d7e5;
            border-radius: 48px;
            background: #ffffff;
            font-size: 22px;
            font-weight: 450;
            color: #2d3748;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.5px;
            background: #f5f7fb;
            text-align: center;
        }
        .btn-primary {
            background: #eef2f8;
            border-color: #c8d1e0;
            color: #1f2a3f;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .btn-primary:hover {
            background: #e6ebf3;
            border-color: #b2bfd4;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .btn-primary:active {
            background: #dce3ed;
            transform: scale(0.97);
        }
        .btn-secondary {
            background: #f5f7fb;
            border-color: #d6dce8;
        }
        .btn-secondary:hover {
            background: #edf1f7;
            border-color: #c2ccdb;
        }

        .result-area {
            margin-top: 32px;
            padding-top: 28px;
            border-top: 1.5px solid #e2e7ef;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 14px 8px;
            border-bottom: 1.5px dashed #e9edf5;
            font-size: 22px;
            color: #1f2a3f;
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .result-item .label {
            color: #4b5a72;
            font-weight: 400;
            font-size: 22px;
        }
        .result-item .value {
            font-weight: 500;
            color: #1a2332;
            font-variant-numeric: tabular-nums;
            font-size: 24px;
        }
        .result-item .value .unit {
            font-weight: 300;
            color: #72809b;
            margin-left: 6px;
            font-size: 18px;
        }

        .footnote {
            margin-top: 32px;
            font-size: 16px;
            color: #8f9bb3;
            text-align: right;
            letter-spacing: 0.3px;
            border-top: 1.5px solid #e9edf5;
            padding-top: 24px;
        }
        .footnote span {
            background: #eef2f8;
            padding: 4px 18px;
            border-radius: 36px;
            font-size: 15px;
            color: #5a6a82;
        }

        @media (max-width: 620px) {
            .card { padding: 28px 20px 34px; }
            h1 { font-size: 26px; }
            .input-row label { width: 60px; font-size: 18px; }
            .input-row input { font-size: 18px; padding: 14px 16px; }
            .btn { font-size: 18px; padding: 14px 10px; }
            .result-item { font-size: 18px; }
            .result-item .value { font-size: 20px; }
            .subhead { font-size: 17px; }
        }

        .card * {
            line-height: 1.4;
        }
        .header-line {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 简约线条 + 标题 -->
        <div class="header-line">
            <span class="bar"></span>
            <h1>DQ轴电感 · 计算</h1>
            <span class="bar"></span>
        </div>
        <div class="subhead">
            通过三相线电感推算 L<sub>d</sub> / L<sub>q</sub>
            <span>线电感 → dq 变换</span>
        </div>

        <!-- 输入区 -->
        <div class="input-group">
            <div class="input-row">
                <label>L<sub>ab</sub></label>
                <input type="number" id="lab" step="any" placeholder="例如 99.1" value="99.1">
                <span class="unit-hint">μH</span>
            </div>
            <div class="input-row">
                <label>L<sub>bc</sub></label>
                <input type="number" id="lbc" step="any" placeholder="例如 149.0" value="149.0">
                <span class="unit-hint">μH</span>
            </div>
            <div class="input-row">
                <label>L<sub>ca</sub></label>
                <input type="number" id="lca" step="any" placeholder="例如 119.4" value="119.4">
                <span class="unit-hint">μH</span>
            </div>
        </div>

        <!-- 按钮 -->
        <div class="action-row">
            <button class="btn btn-primary" id="calcBtn">计算</button>
            <button class="btn btn-secondary" id="resetBtn">重置默认</button>
        </div>

        <!-- 结果 -->
        <div class="result-area" id="resultArea">
            <div class="result-item">
                <span class="label">D轴电感 L<sub>d</sub></span>
                <span class="value" id="ldResult">— <span class="unit">μH</span></span>
            </div>
            <div class="result-item">
                <span class="label">Q轴电感 L<sub>q</sub></span>
                <span class="value" id="lqResult">— <span class="unit">μH</span></span>
            </div>
            <div class="result-item">
                <span class="label">凸极率 ρ = L<sub>q</sub> / L<sub>d</sub></span>
                <span class="value" id="rhoResult">—</span>
            </div>
        </div>

        <div class="footnote">
            <span>作者：星必尘Sguan · 简约线条</span>
        </div>
    </div>

    <script>
        (function() {
            const labInput = document.getElementById('lab');
            const lbcInput = document.getElementById('lbc');
            const lcaInput = document.getElementById('lca');
            const ldSpan = document.getElementById('ldResult');
            const lqSpan = document.getElementById('lqResult');
            const rhoSpan = document.getElementById('rhoResult');

            const DEFAULTS = { lab: 99.1, lbc: 149.0, lca: 119.4 };

            function computeInductances(lab, lbc, lca) {
                const a = lab / 2.0;
                const b = lbc / 2.0;
                const c = lca / 2.0;

                const A = (a + b + c) / 3.0;
                const B = Math.sqrt((a - b) * (a - b) / 3.0 + (A - c) * (A - c));

                const Ld = A - B;
                const Lq = A + B;
                const rho = (Ld !== 0) ? Lq / Ld : Infinity;
                return { Ld, Lq, rho };
            }

            function updateResults(lab, lbc, lca) {
                if (isNaN(lab) || isNaN(lbc) || isNaN(lca) || lab === undefined || lbc === undefined || lca === undefined) {
                    ldSpan.innerHTML = '— <span class="unit">μH</span>';
                    lqSpan.innerHTML = '— <span class="unit">μH</span>';
                    rhoSpan.textContent = '—';
                    return;
                }

                const { Ld, Lq, rho } = computeInductances(lab, lbc, lca);
                ldSpan.innerHTML = Ld.toFixed(5) + ' <span class="unit">μH</span>';
                lqSpan.innerHTML = Lq.toFixed(5) + ' <span class="unit">μH</span>';
                if (isFinite(rho)) {
                    rhoSpan.textContent = rho.toFixed(3);
                } else {
                    rhoSpan.textContent = '∞ (Ld=0)';
                }
            }

            function getInputValues() {
                const lab = parseFloat(labInput.value);
                const lbc = parseFloat(lbcInput.value);
                const lca = parseFloat(lcaInput.value);
                return { lab, lbc, lca };
            }

            function handleCalculate() {
                const { lab, lbc, lca } = getInputValues();
                updateResults(lab, lbc, lca);
            }

            function resetToDefault() {
                labInput.value = DEFAULTS.lab;
                lbcInput.value = DEFAULTS.lbc;
                lcaInput.value = DEFAULTS.lca;
                handleCalculate();
            }

            document.getElementById('calcBtn').addEventListener('click', handleCalculate);
            document.getElementById('resetBtn').addEventListener('click', resetToDefault);

            const inputs = [labInput, lbcInput, lcaInput];
            inputs.forEach(inp => {
                inp.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        handleCalculate();
                    }
                });
            });

            window.addEventListener('load', function() {
                labInput.value = DEFAULTS.lab;
                lbcInput.value = DEFAULTS.lbc;
                lcaInput.value = DEFAULTS.lca;
                handleCalculate();
            });
        })();
    </script>
</body>
</html>
